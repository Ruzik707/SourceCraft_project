# Публикация демонстрационной версии интерфейса на GitHub Pages.
#
# Собирается автономный вариант: интерфейс работает на снимке данных из
# frontend/public/mock, без бэкенда. Это даёт постоянный публичный адрес, по
# которому можно открыть рейтинг, страницы анализа и выгрузку отчётов.
# Интерфейс сам показывает плашку «Демо-режим», чтобы результат нельзя было
# принять за боевой сервис.
name: Демо-версия на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci

      - name: Сборка автономной версии
        working-directory: frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_SOURCE: mock
          VITE_AUTH_SOURCE: mock
        run: npm run build

      - name: Страница-заглушка для прямых ссылок
        # Pages не умеет переписывать пути, поэтому /repo/owner/name отдаётся
        # через 404.html — маршрут дальше разбирает сам интерфейс
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
